name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-trigger:
    name: Validate release trigger
    runs-on: ubuntu-24.04
    steps:
      - name: Require a semantic version tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3." >&2
            exit 1
          fi

      - name: Confirm manual dry-run
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual execution is a dry-run and cannot publish a GitHub release."

  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.1.3

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet ./...

      - name: Test Go behavior
        run: go test -race ./...

      - name: Install frontend dependencies
        run: pnpm --dir desktop/frontend install --frozen-lockfile

      - name: Test frontend behavior
        run: pnpm --dir desktop/frontend test

      - name: Check frontend quality
        run: pnpm --dir desktop/frontend run quality

  desktop-macos:
    name: Desktop macOS universal (ad hoc)
    needs:
      - validate-trigger
      - verify
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.1.3

      - name: Install pinned Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Set bundle version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0' }}
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_VERSION}" desktop/build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_VERSION}" desktop/build/darwin/Info.plist

      - name: Build universal desktop bundle
        working-directory: desktop
        run: |
          "$(go env GOPATH)/bin/wails" build \
            -clean \
            -m \
            -nosyncgomod \
            -trimpath \
            -platform darwin/universal

      - name: Verify ad hoc signature
        run: |
          codesign --verify --deep --strict --verbose=2 desktop/build/bin/Corsarr.app
          SIGNATURE_INFO="$(codesign -dv --verbose=4 desktop/build/bin/Corsarr.app 2>&1)"
          printf '%s\n' "${SIGNATURE_INFO}"
          grep -q 'Signature=adhoc' <<<"${SIGNATURE_INFO}"
          grep -q 'TeamIdentifier=not set' <<<"${SIGNATURE_INFO}"

      - name: Package macOS application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/bin/Corsarr.app \
            corsarr_desktop_darwin_universal.zip

      - name: Attest macOS artifact
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: corsarr_desktop_darwin_universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corsarr-desktop-macos-${{ github.sha }}
          path: corsarr_desktop_darwin_universal.zip
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop Windows x64 and x86 (unsigned)
    needs:
      - validate-trigger
      - verify
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@11.1.3

      - name: Install pinned Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Windows desktop application
        shell: pwsh
        working-directory: desktop
        run: |
          $wails = Join-Path (go env GOPATH) "bin\wails.exe"
          & $wails build `
            -clean `
            -m `
            -nosyncgomod `
            -trimpath `
            -platform windows/amd64,windows/386
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable Windows applications
        shell: pwsh
        run: |
          $packages = @(
            @{
              Source = "desktop/build/bin/Corsarr-amd64.exe"
              Directory = "package-amd64"
              Archive = "corsarr_desktop_windows_amd64.zip"
            },
            @{
              Source = "desktop/build/bin/Corsarr-386.exe"
              Directory = "package-386"
              Archive = "corsarr_desktop_windows_386.zip"
            }
          )

          foreach ($package in $packages) {
            New-Item -ItemType Directory -Path $package.Directory | Out-Null
            Copy-Item $package.Source (Join-Path $package.Directory "Corsarr.exe")
            Copy-Item README.md, LICENSE $package.Directory
            Compress-Archive -Path "$($package.Directory)/*" -DestinationPath $package.Archive
          }

      - name: Attest Windows x64 artifact
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: corsarr_desktop_windows_amd64.zip

      - name: Attest Windows x86 artifact
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: corsarr_desktop_windows_386.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corsarr-desktop-windows-${{ github.sha }}
          path: |
            corsarr_desktop_windows_amd64.zip
            corsarr_desktop_windows_386.zip
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop Linux AMD64 (unsigned)
    needs:
      - validate-trigger
      - verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.1.3

      - name: Install pinned Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Linux desktop application
        working-directory: desktop
        run: |
          "$(go env GOPATH)/bin/wails" build \
            -clean \
            -m \
            -nosyncgomod \
            -trimpath \
            -platform linux/amd64 \
            -tags webkit2_41

      - name: Package portable Linux application
        run: |
          mkdir package
          install -m 0755 desktop/build/bin/Corsarr package/Corsarr
          cp README.md LICENSE package/
          tar -C package -czf corsarr_desktop_linux_amd64.tar.gz .

      - name: Attest Linux artifact
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: corsarr_desktop_linux_amd64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corsarr-desktop-linux-${{ github.sha }}
          path: corsarr_desktop_linux_amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  dry-run-cli:
    name: CLI release snapshot
    if: github.event_name == 'workflow_dispatch'
    needs:
      - validate-trigger
      - verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install pinned Syft for snapshot SBOMs
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          syft-version: v1.50.0

      - name: Build CLI release snapshot
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Upload CLI snapshot
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: corsarr-cli-dry-run-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-macos
      - desktop-windows
      - desktop-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Download desktop artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: corsarr-desktop-*-${{ github.sha }}
          path: desktop-assets
          merge-multiple: true

      - name: Generate desktop checksums
        working-directory: desktop-assets
        run: sha256sum corsarr_desktop_* > desktop_checksums.txt

      - name: Install pinned Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          syft-version: v1.50.0

      - name: Publish CLI artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add desktop artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" desktop-assets/* --clobber
