id: jellyseerr
name: Seerr
category: request
description: Request management for movies and TV shows
image: ghcr.io/seerr-team/seerr:v3.4.1
container_name: jellyseerr
init: true

ports:
  - host: "5055"
    container: "5055"
    protocol: tcp

volumes:
  - host: "${ARRPATH}config/jellyseerr"
    container: "/app/config"

environment:
  - "TZ=${TZ}"
  - "PUID=${PUID}"
  - "PGID=${PGID}"
  - "UMASK=${UMASK}"

network:
  vpn_mode:
    network_mode: "service:gluetun"
  bridge_mode:
    hostname: jellyseerr
    networks:
      - media

restart: unless-stopped
supports_vpn: true
requires_vpn: false
dependencies:
  - jellyfin
optional: true

web_ui:
  port: "5055"
